<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7f4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Visitenkarten"><title>viacruz Visitenkarten</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon.svg"><link rel="stylesheet" href="styles.css?v=0.2.4"></head><body>
<div class="app-shell"><header class="topbar"><div><div class="brand">viacruz <span>Visitenkarten</span></div><div class="tagline">Deine Kontakte. Deine Karten.</div></div><button id="settingsBtn" class="icon-btn">⚙︎</button></header><main id="app" class="content"></main><nav class="bottom-nav"><button data-route="home" class="nav-item active"><span>⌂</span><small>Start</small></button><button data-route="cards" class="nav-item"><span>▤</span><small>Karten</small></button><button data-route="search" class="nav-item"><span>⌕</span><small>Suche</small></button><button data-route="settings" class="nav-item"><span>⚙︎</span><small>Einstellungen</small></button></nav></div>
<dialog id="cardDialog" class="sheet"><form id="cardForm" class="sheet-card"><div class="sheet-head"><div><div class="eyebrow">Visitenkarte</div><h2 id="formTitle">Neue Karte</h2></div><button type="button" class="icon-btn" id="closeDialog">×</button></div>
<div class="photo-grid"><div class="photo-box"><strong>Vorderseite</strong><button type="button" class="camera-btn" id="frontCamera">📷 Vorderseite fotografieren</button><div class="guide-preview"><img id="frontPreview" hidden><i></i></div></div><div class="photo-box"><strong>Rückseite</strong><button type="button" class="camera-btn" id="backCamera">📷 Rückseite fotografieren</button><div class="guide-preview"><img id="backPreview" hidden><i></i></div></div></div>
<div class="capture-hint">Die Visitenkarte wird direkt innerhalb des sichtbaren Kamerarahmens aufgenommen.</div><div id="scanBox" class="scan-box" hidden><div class="scan-spinner"></div><div><strong id="scanTitle"></strong><div id="scanStatus" class="hint"></div></div></div><div id="qrResult" class="qr-result" hidden></div>
<div class="grid-2"><label>Name<input id="name"></label><label>Firma / Praxis<input id="company"></label></div><label>Beruf / Tätigkeit<input id="jobTitle"></label><div class="grid-2"><label>Telefon<input id="phone" type="tel"></label><label>E-Mail<input id="email" type="email"></label></div><label>Website<input id="website"></label><label>Adresse<input id="address"></label><label>Erkannter Kartentext<textarea id="rawText"></textarea></label><label>QR-Code-Inhalt<textarea id="qrText"></textarea></label><label>Stichwörter<input id="tags"></label><label>Notizen<textarea id="notes"></textarea></label><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelBtn">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></form></dialog>
<dialog id="cameraDialog" class="camera-dialog"><div class="camera-shell"><video id="cameraVideo" autoplay playsinline muted></video><div class="camera-mask"><div class="live-card-frame"><span></span><span></span><span></span><span></span></div></div><div class="camera-instruction">Visitenkarte vollständig innerhalb des Rahmens ausrichten</div><div class="camera-controls"><button type="button" id="cameraCancel" class="camera-control">Abbrechen</button><button type="button" id="cameraShoot" class="shutter" aria-label="Foto aufnehmen"></button><button type="button" id="cameraFlip" class="camera-control">↻ Kamera</button></div></div></dialog>
<input id="importFile" type="file" accept="application/json" hidden><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="app.js?v=0.2.4"></script></body></html>
