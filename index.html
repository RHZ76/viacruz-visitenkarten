<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Visitenkarten">
  <title>viacruz Visitenkarten</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="styles.css?v=0.1.0">
</head>
<body>
<div class="app-shell">
<header class="topbar"><div><div class="brand">viacruz <span>Visitenkarten</span></div><div class="tagline">Deine Kontakte. Deine Karten.</div></div><button id="settingsBtn" class="icon-btn" aria-label="Einstellungen">⚙︎</button></header>
<main id="app" class="content"></main>
<nav class="bottom-nav">
<button data-route="home" class="nav-item active"><span>⌂</span><small>Start</small></button>
<button data-route="cards" class="nav-item"><span>▤</span><small>Karten</small></button>
<button data-route="search" class="nav-item"><span>⌕</span><small>Suche</small></button>
<button data-route="settings" class="nav-item"><span>⚙︎</span><small>Einstellungen</small></button>
</nav></div>
<dialog id="cardDialog" class="sheet"><form id="cardForm" class="sheet-card">
<div class="sheet-head"><div><div class="eyebrow">Visitenkarte</div><h2 id="formTitle">Neue Karte</h2></div><button type="button" class="icon-btn" id="closeDialog">×</button></div>
<input type="hidden" id="cardId">
<div class="photo-grid">
<label class="photo-box">Vorderseite<input id="frontPhoto" type="file" accept="image/*" capture="environment"><img id="frontPreview" hidden></label>
<label class="photo-box">Rückseite<input id="backPhoto" type="file" accept="image/*" capture="environment"><img id="backPreview" hidden></label>
</div>
<div class="hint">Fotos werden ausschließlich auf diesem Gerät gespeichert.</div>
<div class="grid-2"><label>Name<input id="name" autocomplete="name"></label><label>Firma / Praxis<input id="company" autocomplete="organization"></label></div>
<label>Beruf / Tätigkeit<input id="jobTitle" placeholder="z. B. Heilpraktiker"></label>
<div class="grid-2"><label>Telefon<input id="phone" type="tel" autocomplete="tel"></label><label>E-Mail<input id="email" type="email" autocomplete="email"></label></div>
<label>Website<input id="website" inputmode="url"></label>
<label>Adresse<input id="address" autocomplete="street-address"></label>
<label>Gesamter Kartentext<textarea id="rawText" placeholder="Hier kann später der automatisch erkannte Text stehen. Für v0.1.0 kannst du Text auch einfügen oder ergänzen."></textarea></label>
<label>Stichwörter<input id="tags" placeholder="z. B. Gesundheit, Zeitz"></label>
<label>Notizen<textarea id="notes"></textarea></label>
<div class="sheet-actions"><button type="button" class="btn secondary" id="cancelBtn">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div>
</form></dialog>
<input id="importFile" type="file" accept="application/json" hidden>
<script src="app.js?v=0.1.0"></script>
</body></html>
